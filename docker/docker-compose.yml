version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ashai-postgres
    environment:
      POSTGRES_DB: ashai_db
      POSTGRES_USER: ashai_user
      POSTGRES_PASSWORD: ashai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ashai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ashai_db
      SPRING_DATASOURCE_USERNAME: ashai_user
      SPRING_DATASOURCE_PASSWORD: ashai_password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ashai-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data:
