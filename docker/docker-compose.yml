services:
  ollama:
    image: ollama/ollama:latest
    container_name: ashai-ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: ashai-postgres
    environment:
      POSTGRES_DB: ashai_db
      POSTGRES_USER: ashai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashai_user -d ashai_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ashai-backend
    env_file:
      - ../backend/.env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ashai_db
      SPRING_DATASOURCE_USERNAME: ashai_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      FRONTEND_URL: http://localhost:5500
      PERSONAL_MODE_ENABLED: "true"
      MAIL_ENABLED: "false"
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_STANDARD_MODEL: gemma3:4b
      OLLAMA_PRO_MODEL: gemma3:4b
      OLLAMA_CODE_MODEL: qwen2.5-coder:7b
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ashai-frontend
    ports:
      - "5500:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
  postgres_data:
