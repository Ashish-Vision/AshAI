version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ashai-postgres
    environment:
      POSTGRES_DB: ashai_db
      POSTGRES_USER: ashai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: ashai-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ashai_db
      SPRING_DATASOURCE_USERNAME: ashai_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your deployment environment}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-missing-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-missing-google-client-secret}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-missing-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-missing-github-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5500}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: ashai-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data:
