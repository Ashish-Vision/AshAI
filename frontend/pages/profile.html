<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | AshAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 32px;
            background: var(--bg-card, #ffffff);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color, #e5e7eb);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color, #e5e7eb);
            margin-bottom: 32px;
        }
        .avatar-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            font-size: 32px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }
        .profile-info h2 {
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 700;
        }
        .profile-info p {
            margin: 0;
            color: #6b7280;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 15px;
            box-sizing: border-box;
            background: var(--bg-input, #f9fafb);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="dashboard-page">
    <div class="profile-container">
        <a href="./dashboard.html" class="nav-back">
            &larr; Back to Dashboard
        </a>

        <div class="profile-header">
            <div class="avatar-badge" id="avatarBadge">A</div>
            <div class="profile-info">
                <h2 id="userNameDisplay">User Profile</h2>
                <p id="userEmailDisplay">loading...</p>
            </div>
        </div>

        <form id="profileForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" disabled readonly>
            </div>

            <div class="form-group">
                <label for="bio">Bio</label>
                <textarea id="bio" class="form-control" rows="3" placeholder="Tell us about yourself..."></textarea>
            </div>

            <button type="submit" class="btn-primary">Save Profile Changes</button>
            <span id="profileStatusMsg" style="margin-left: 12px; font-weight: 500;"></span>
        </form>
    </div>

    <script type="module">
        import { apiRequest } from "../js/api.js";

        document.addEventListener("DOMContentLoaded", async () => {
            const avatarBadge = document.getElementById("avatarBadge");
            const userNameDisplay = document.getElementById("userNameDisplay");
            const userEmailDisplay = document.getElementById("userEmailDisplay");
            const fullNameInput = document.getElementById("fullName");
            const emailInput = document.getElementById("email");
            const bioInput = document.getElementById("bio");
            const profileForm = document.getElementById("profileForm");
            const statusMsg = document.getElementById("profileStatusMsg");

            try {
                const user = await apiRequest("/profile");
                userNameDisplay.textContent = user.fullName || "User Profile";
                userEmailDisplay.textContent = user.email || "";
                fullNameInput.value = user.fullName || "";
                emailInput.value = user.email || "";
                bioInput.value = user.bio || "";
                avatarBadge.textContent = (user.fullName || "A").charAt(0).toUpperCase();
            } catch (err) {
                console.error("Failed to load user profile:", err);
            }

            profileForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                statusMsg.textContent = "Saving...";
                statusMsg.style.color = "#6b7280";

                try {
                    const updated = await apiRequest("/profile", {
                        method: "PUT",
                        body: JSON.stringify({
                            fullName: fullNameInput.value,
                            bio: bioInput.value
                        })
                    });
                    userNameDisplay.textContent = updated.fullName;
                    avatarBadge.textContent = (updated.fullName || "A").charAt(0).toUpperCase();
                    statusMsg.textContent = "Profile updated successfully!";
                    statusMsg.style.color = "#10b981";
                } catch (err) {
                    statusMsg.textContent = err.message || "Failed to update profile.";
                    statusMsg.style.color = "#ef4444";
                }
            });
        });
    </script>
</body>
</html>
